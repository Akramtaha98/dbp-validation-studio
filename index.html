<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBP Validation Studio</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--panel2:#f0f2f8;--ink:#171a26;--mut:#6a7089;--line:#e2e5ef;--pri:#4f46e5;--priInk:#fff;--ok:#16a34a;--bad:#dc2626;--unk:#d97706;--okbg:#dcfce7;--badbg:#fee2e2;--unkbg:#fef3c7;--sh:0 1px 3px rgba(20,24,40,.08),0 4px 14px rgba(20,24,40,.05)}
[data-theme=dark]{--bg:#0f1117;--panel:#181b25;--panel2:#212533;--ink:#e8eaf3;--mut:#8f96ad;--line:#2a2f40;--pri:#818cf8;--priInk:#0f1117;--ok:#4ade80;--bad:#f87171;--unk:#fbbf24;--okbg:#12301f;--badbg:#3a1618;--unkbg:#3a2c0e;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;white-space:nowrap}
.prog{flex:1;min-width:80px}.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.pt{font-size:12px;color:var(--mut);margin-top:3px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{background:var(--panel2)}.btn.p{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.menu{position:relative}.dd{display:none;position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);min-width:200px;z-index:20;padding:4px}
.dd.open{display:block}.dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}.dd button:hover{background:var(--panel2)}
main{flex:1;display:flex;min-height:0}
aside{width:300px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.sb{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=search],textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:3px 10px;font-size:12px}.chip.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
#list{overflow:auto;flex:1}
.it{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.it:hover{background:var(--panel2)}.it.cur{background:var(--panel2);box-shadow:inset 3px 0 var(--pri)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--line)}
.dot.v{background:var(--ok)}.dot.i{background:var(--bad)}.dot.n{background:var(--unk)}
.it span{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
section{flex:1;overflow:auto;padding:18px;min-width:0}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:110px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
.lb{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.q{font-size:18px;font-weight:600}.a{white-space:pre-wrap}
details summary{cursor:pointer;color:var(--mut);font-size:13px;font-weight:600}
details pre{white-space:pre-wrap;margin:8px 0 0;font:13px/1.5 inherit;color:var(--mut)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mut)}
.badge.v{background:var(--okbg);color:var(--ok)}.badge.i{background:var(--badbg);color:var(--bad)}.badge.n{background:var(--unkbg);color:var(--unk)}
.act{position:fixed;left:300px;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;z-index:10}
.lab{border:2px solid;border-radius:10px;padding:10px 20px;font-weight:700;background:none}
.lab.v{color:var(--ok);border-color:var(--ok)}.lab.i{color:var(--bad);border-color:var(--bad)}.lab.n{color:var(--unk);border-color:var(--unk)}
.lab.v.on{background:var(--ok);color:var(--priInk)}.lab.i.on{background:var(--bad);color:#fff}.lab.n.on{background:var(--unk);color:#111}
.lab kbd,.k{font:11px monospace;opacity:.6;margin-left:6px}
.auto{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
#welcome{margin:60px auto;max-width:520px;text-align:center}
#drop{border:2px dashed var(--line);border-radius:14px;padding:34px 16px;margin:16px 0;color:var(--mut)}#drop.o{border-color:var(--pri);background:var(--panel2)}
#msg{color:var(--unk);font-size:13px}
.hide{display:none!important}
@media(max-width:800px){aside{position:fixed;inset:52px 0 0 0;width:auto;z-index:15;transform:translateX(-100%);transition:.2s}aside.open{transform:none}.act{left:0}#tg{display:inline-block!important}}
#tg{display:none}
</style></head><body>
<header>
<button class="btn" id="tg">☰</button>
<h1>DBP Validation</h1>
<div class="prog"><div class="bar" id="bar"></div><div class="pt" id="pt"></div></div>
<input type="text" id="ann" placeholder="Your name" style="width:130px">
<button class="btn" id="th" title="Toggle light/dark">🌓</button>
<button class="btn" id="up">Load file</button>
<div class="menu"><button class="btn p" id="exb">Export ▾</button>
<div class="dd" id="dd"><button data-x="csv">Download CSV</button><button data-x="copy">Copy CSV</button><button data-x="jsonl">Valid-only JSONL</button><button data-x="reset">Reset labels</button></div></div>
<input type="file" id="fi" accept=".jsonl,.json,.txt" class="hide">
</header>
<main>
<aside id="side"><div class="sb"><input type="search" id="qs" placeholder="Search…">
<div class="chips" id="chips"></div></div><div id="list"></div></aside>
<section id="sec">
<div id="welcome" class="hide"><h2>Load a dataset</h2><div id="msg"></div>
<div id="drop">Drop a .jsonl file here, or click to choose<br><small>50 / 1000 / 3000 items — any size</small></div>
<button class="btn p" id="up2">Choose file</button></div>
<div class="wrap hide" id="view">
<div class="card"><div class="lb"><span>Question <span id="idx"></span></span><span class="badge" id="st"></span></div><div class="q" id="q"></div></div>
<div class="card"><div class="lb">Model answer</div><div class="a" id="a"></div>
<details id="thd" class="hide" style="margin-top:10px"><summary>Show reasoning</summary><pre id="th2"></pre></details></div>
<div class="card" id="cxc"><details><summary>DBP reference context</summary><pre id="cx"></pre></details></div>
<div class="card"><div class="lb">Note (optional)</div><textarea id="nt" rows="2" placeholder="Why invalid / unsure?"></textarea></div>
</div></section></main>
<div class="act hide" id="act">
<button class="btn" id="pv">← Prev</button>
<button class="lab v" data-l="Valid">Valid<kbd>1</kbd></button>
<button class="lab i" data-l="Invalid">Invalid<kbd>2</kbd></button>
<button class="lab n" data-l="Not Sure">Not sure<kbd>3</kbd></button>
<button class="btn" id="nx">Next →</button>
<button class="btn" id="nu">Next unlabeled<span class="k">U</span></button>
<label class="auto"><input type="checkbox" id="aa" checked>auto-advance</label>
</div>
<script>
const $=id=>document.getElementById(id);
let items=[],labels={},cur=0,filt="all",qs="",key="",fname="dbp_1000.jsonl";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
// theme
function theme(t){document.documentElement.dataset.theme=t;ls.set("dbp_theme",t)}
theme(ls.get("dbp_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("th").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("ann").value=ls.get("dbp_ann")||"";$("ann").oninput=e=>ls.set("dbp_ann",e.target.value);
// parse
function fromMsgs(m){
 const u=(m.find(x=>x.role==="user")||{}).content||"",as=(m.find(x=>x.role==="assistant")||{}).content||"";
 let ctx="",q=u;const i=u.lastIndexOf("Soalan:\n");
 if(u.indexOf("Konteks")>=0&&i>=0){ctx=u.slice(0,i).trim();q=u.slice(i+8).trim()}
 let think="",ans=as;const t=as.match(/<think>([\s\S]*?)<\/think>/);
 if(t){think=t[1].trim();ans=as.replace(t[0],"").trim()}
 return{q,a:ans,think,ctx}}
function parse(text){
 const out=[];const push=o=>{
  if(o.example&&o.example.messages){const r=fromMsgs(o.example.messages);r.note=(o.reasons||[]).join("; ");out.push(r)}
  else if(o.messages){out.push(fromMsgs(o.messages))}
  else{const q=o.question||o.Question||o.q||o.instruction||o.prompt||"",a=o.answer||o.Answer||o.a||o.output||o.response||"";out.push({q,a,think:"",ctx:o.context||""})}};
 const t=text.trim();
 if(t[0]==="["){try{JSON.parse(t).forEach(push);return out}catch(e){}}
 t.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;try{push(JSON.parse(l))}catch(e){}});
 return out}
function load(text,nm){
 const p=parse(text);if(!p.length){$("msg").textContent="No valid records found in "+nm;show("welcome");return}
 items=p;fname=nm;key="dbp_lab_"+nm+"_"+p.length;
 try{labels=JSON.parse(ls.get(key)||"{}")}catch(e){labels={}}
 cur=0;show("main");buildChips();renderList();render()}
function show(w){const m=w==="main";$("welcome").classList.toggle("hide",m);$("view").classList.toggle("hide",!m);$("act").classList.toggle("hide",!m)}
// view
const S={Valid:"v",Invalid:"i","Not Sure":"n"};
function vis(){return items.map((x,i)=>i).filter(i=>{const l=(labels[i]||{}).l;
 if(filt==="todo"&&l)return false;if(filt!=="all"&&filt!=="todo"&&l!==filt)return false;
 if(qs){const x=items[i];if(!(x.q+" "+x.a).toLowerCase().includes(qs))return false}return true})}
function buildChips(){$("chips").innerHTML="";[["all","All"],["todo","To do"],["Valid","Valid"],["Invalid","Invalid"],["Not Sure","Unsure"]].forEach(([k,n])=>{
 const b=document.createElement("button");b.className="chip"+(filt===k?" on":"");b.textContent=n;b.onclick=()=>{filt=k;buildChips();renderList()};$("chips").appendChild(b)})}
function renderList(){const L=$("list");L.innerHTML="";const v=vis();
 v.slice(0,1500).forEach(i=>{const d=document.createElement("div");d.className="it"+(i===cur?" cur":"");
  const l=(labels[i]||{}).l;d.innerHTML='<i class="dot '+(S[l]||"")+'"></i><span></span>';
  d.lastChild.textContent=(i+1)+". "+items[i].q;d.onclick=()=>{cur=i;render();$("side").classList.remove("open")};L.appendChild(d)});
 if(!v.length)L.innerHTML='<div class="it"><span>No items</span></div>'}
function stats(){let c={Valid:0,Invalid:0,"Not Sure":0};Object.values(labels).forEach(x=>{if(c[x.l]!=null)c[x.l]++});
 const n=items.length,d=c.Valid+c.Invalid+c["Not Sure"];
 $("bar").innerHTML=`<i style="width:${c.Valid/n*100}%;background:var(--ok)"></i><i style="width:${c.Invalid/n*100}%;background:var(--bad)"></i><i style="width:${c["Not Sure"]/n*100}%;background:var(--unk)"></i>`;
 $("pt").textContent=`${d}/${n} labeled · ✓${c.Valid} ✗${c.Invalid} ?${c["Not Sure"]}`}
function render(){const x=items[cur];if(!x)return;
 $("idx").textContent=`#${cur+1} of ${items.length}`;$("q").textContent=x.q;$("a").textContent=x.a;
 $("thd").classList.toggle("hide",!x.think);$("th2").textContent=x.think;
 $("cxc").classList.toggle("hide",!x.ctx);$("cx").textContent=x.ctx;
 const e=labels[cur]||{};$("st").textContent=e.l||"Unlabeled";$("st").className="badge "+(S[e.l]||"");
 $("nt").value=e.n||(x.note||"");
 document.querySelectorAll(".lab").forEach(b=>b.classList.toggle("on",b.dataset.l===e.l));
 stats();document.querySelectorAll(".it").forEach((el,k)=>{});renderList();
 const c=document.querySelector(".it.cur");if(c)c.scrollIntoView({block:"nearest"});$("sec").scrollTop=0}
function save(){ls.set(key,JSON.stringify(labels))}
function setLabel(v){labels[cur]={l:v,n:$("nt").value,by:$("ann").value,t:new Date().toISOString()};save();
 if($("aa").checked)go(1);else render()}
function go(d){const v=vis();if(!v.length){render();return}
 let p=v.indexOf(cur);if(p<0){cur=d>0?v.find(i=>i>cur)??v[v.length-1]:[...v].reverse().find(i=>i<cur)??v[0]}
 else cur=v[Math.min(v.length-1,Math.max(0,p+d))];render()}
function nextUn(){for(let k=1;k<=items.length;k++){const i=(cur+k)%items.length;if(!labels[i]){cur=i;return render()}}alert("All items labeled 🎉")}
document.querySelectorAll(".lab").forEach(b=>b.onclick=()=>setLabel(b.dataset.l));
$("pv").onclick=()=>go(-1);$("nx").onclick=()=>go(1);$("nu").onclick=nextUn;
$("nt").oninput=()=>{if(labels[cur]){labels[cur].n=$("nt").value;save()}};
$("qs").oninput=e=>{qs=e.target.value.toLowerCase();renderList()};
$("tg").onclick=()=>$("side").classList.toggle("open");
addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||!items.length)return;
 if(e.key==="1")setLabel("Valid");else if(e.key==="2")setLabel("Invalid");else if(e.key==="3")setLabel("Not Sure");
 else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key.toLowerCase()==="u")nextUn()});
// export
function cc(s){s=String(s??"");return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function makeCsv(){const r=[["id","question","answer","label","note","annotator","timestamp"]];
 items.forEach((x,i)=>{const e=labels[i]||{};r.push([i+1,x.q,x.a,e.l||"",e.n||"",e.by||"",e.t||""])});
 return "﻿"+r.map(a=>a.map(cc).join(",")).join("\r\n")}
async function saveFile(name,content,mime){
 try{if(window.claude&&window.claude.use){const d=await window.claude.use("downloads");if(d&&d.save){await d.save(name,content,mime);return}}}catch(e){}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const base=()=>fname.replace(/\.[^.]+$/,"")+"_labels";
$("exb").onclick=e=>{e.stopPropagation();$("dd").classList.toggle("open")};
addEventListener("click",()=>$("dd").classList.remove("open"));
$("dd").onclick=async e=>{const x=e.target.dataset.x;if(!x)return;
 if(x==="csv")saveFile(base()+".csv",makeCsv(),"text/csv");
 else if(x==="copy"){try{await navigator.clipboard.writeText(makeCsv());alert("CSV copied")}catch(e){alert("Copy failed")}}
 else if(x==="jsonl")saveFile(base()+"_valid.jsonl",items.filter((_,i)=>(labels[i]||{}).l==="Valid").map(o=>JSON.stringify({question:o.q,answer:o.a})).join("\n"),"application/x-ndjson");
 else if(x==="reset"&&confirm("Erase all labels for this dataset?")){labels={};save();render()}};
// file input
function readFile(f){if(!f)return;const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f)}
$("up").onclick=$("up2").onclick=()=>$("fi").click();$("fi").onchange=e=>readFile(e.target.files[0]);
const dz=$("drop");dz.onclick=()=>$("fi").click();
["dragenter","dragover"].forEach(v=>addEventListener(v,e=>{e.preventDefault();dz.classList.add("o")}));
["dragleave","drop"].forEach(v=>addEventListener(v,e=>{e.preventDefault();dz.classList.remove("o")}));
addEventListener("drop",e=>readFile(e.dataTransfer.files[0]));
addEventListener("paste",e=>{const t=e.clipboardData.getData("text");if(t&&t.length>50&&!/INPUT|TEXTAREA/.test(e.target.tagName))load(t,"pasted.jsonl")});
// default data
(async()=>{try{const r=await fetch("dbp_1000.jsonl");if(!r.ok)throw 0;load(await r.text(),"dbp_1000.jsonl")}
 catch(e){$("msg").textContent="dbp_1000.jsonl not found next to this page — load your file below.";show("welcome")}})();
</script></body></html>
